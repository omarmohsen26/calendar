<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f2f2f7" id="metaTheme">
<title>Daybook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#F7F7F8; --card:#FFFFFF; --card2:#F1F1F3; --text:#1A1D21; --sub:#5C6B64; --sep:#E9E5DC;
  --accent:#F4633A; --red:#DC2626; --success:#16A34A; --celebrate:#FBBF24;
  --dayAmber:#D9B236; --eveOrange:#D97538; --nightBlue:#6987D9; --offGray:#8E929E; --trainGreen:#22A35A;
  --workout:#22A35A; --content:#D97538; --steel:#9A73E0; --task:#D9B236; --personal:#E0566F;
  --tintDay:rgba(217,178,54,.16); --tintEve:rgba(217,117,56,.16); --tintNight:rgba(105,135,217,.16); --tintOff:rgba(90,95,110,.10);
}
html[data-theme="dark"]{
  --bg:#121417; --card:#1C2024; --card2:#23282E; --text:#F0F2F1; --sub:#93A19A; --sep:#2A2F35;
  --accent:#FF8A66; --success:#4ADE80; --celebrate:#FBBF24;
  --dayAmber:#FFD23F; --eveOrange:#FF8C42; --nightBlue:#7C9EFF; --offGray:#5A5F6E; --trainGreen:#4ADE80;
  --workout:#4ADE80; --content:#FF8C42; --steel:#B18CFF; --task:#FFD23F; --personal:#FF7A93;
  --tintDay:rgba(255,210,63,.18); --tintEve:rgba(255,140,66,.18); --tintNight:rgba(124,158,255,.22); --tintOff:rgba(90,95,110,.22);
}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}50%{box-shadow:0 0 18px 2px rgba(251,191,36,.4)}}
@keyframes greenFlash{0%{background:rgba(74,222,128,.35)}100%{background:var(--card)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes confetti{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.ev .chk::after{transition:background .18s,border-color .18s}
.ev.done .chk{animation:pop .35s ease}
.ev.flash{animation:greenFlash .5s ease}
.celebrate{animation:glowPulse 2.4s ease-in-out infinite;border:1px solid rgba(251,191,36,.65);background:rgba(251,191,36,.07)}
.streak{animation:jump .6s ease}
.enc{font-size:14px;color:var(--sub);margin:2px 2px 0;line-height:1.4}
.confetti-dot{position:fixed;width:8px;height:8px;border-radius:50%;z-index:99;pointer-events:none;animation:confetti .8s ease-out forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
header{padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
header h1{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:0;line-height:1.1}
header .hdr-actions{display:flex;gap:8px;align-items:center;padding-bottom:4px}
.hbtn{min-width:48px;height:44px;border:0;border-radius:14px;background:var(--card);color:var(--accent);font-size:15px;font-weight:600;padding:0 14px;cursor:pointer;box-shadow:0 2px 12px rgba(26,43,38,.06)}
.hbtn.icon{width:48px;padding:0;display:flex;align-items:center;justify-content:center}
.hbtn svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;padding:4px 20px 110px;-webkit-overflow-scrolling:touch}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40}
nav .bar{max-width:480px;margin:0 auto;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--sub);font-size:12px;font-weight:500;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:0 2px 12px rgba(26,43,38,.06)}
.shift-card{display:flex;align-items:center;gap:14px}
.shift-badge{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;flex:none}
.shift-card .sc-t{font-size:17px;font-weight:700}
.shift-card .sc-s{font-size:14px;color:var(--sub);margin-top:2px}
.badge-D{background:var(--dayAmber);color:#5c4700}.badge-E{background:var(--eveOrange)}.badge-N{background:var(--nightBlue)}.badge-O{background:var(--offGray)}.badge-T{background:var(--trainGreen)}
.ev{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 12px rgba(26,43,38,.06);border-left:5px solid var(--sub)}
.ev .tm{font-size:13px;color:var(--sub);width:52px;flex:none;padding-top:2px;text-align:right}
.ev .tt{font-size:16px;font-weight:600;line-height:1.25}
.ev .ct{font-size:12px;color:var(--sub);margin-top:2px}
.ev .att{font-size:14px;margin-left:2px}
.ev.done .tt{text-decoration:line-through;color:var(--sub)}
.ev .chk{width:48px;height:48px;border-radius:50%;border:0;flex:none;margin:-10px -8px -10px auto;align-self:center;background:none;cursor:pointer;position:relative;padding:0}
.ev .chk::after{content:"";position:absolute;left:10px;top:10px;width:28px;height:28px;border-radius:50%;border:2px solid var(--sep);box-sizing:border-box}
.ev.done .chk::after{content:"\2713";border-color:var(--success);background:var(--success);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.cat-workout{border-left-color:var(--workout)}.cat-content{border-left-color:var(--content)}.cat-steel{border-left-color:var(--steel)}.cat-task{border-left-color:var(--task)}.cat-personal{border-left-color:var(--personal)}
.empty{padding:40px 24px;text-align:center;color:var(--sub);font-size:15px;line-height:1.5}
.sect{font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin:18px 4px 2px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:3px;margin:6px 0 10px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 0;font-size:15px;font-weight:600;color:var(--sub);min-height:44px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ptag{font-size:10px;font-weight:700;color:var(--content);border:1px dashed var(--content);border-radius:6px;padding:0 5px;vertical-align:2px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mgrid .wd{font-size:12px;font-weight:600;color:var(--sub);text-align:center;padding:6px 0}
.mcell{height:58px;overflow:hidden;border-radius:10px;background:var(--card);padding:5px 4px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;border:0;font:inherit;color:var(--text)}
.mcell.dim{opacity:.35}
.mcell .dn{font-size:16px;font-weight:600;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.mcell.today .dn{background:var(--accent);color:#fff}
.mcell.sel .dn{box-shadow:0 0 0 2px var(--accent)}
.mcell .sl{font-size:12px;font-weight:800;margin-top:1px;border-radius:5px;padding:0 5px;line-height:16px}
.mcell .more{font-size:12px;color:var(--sub);line-height:1}
.mcell .dots{display:flex;gap:3px;margin-top:auto;padding-bottom:2px;min-height:6px}
.mcell .dots i{width:6px;height:6px;border-radius:50%;display:block}
.tint-D{background:var(--tintDay)}.tint-E{background:var(--tintEve)}.tint-N{background:var(--tintNight)}.tint-O{background:var(--tintOff)}
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(64px,1fr));gap:4px;overflow-x:auto;padding-bottom:4px}
.wcol{background:var(--card);border-radius:12px;min-height:220px;min-width:64px;padding:4px;display:flex;flex-direction:column;gap:4px;cursor:pointer;border:0;font:inherit;color:var(--text);text-align:center}
.wcol .wd{font-size:12px;color:var(--sub);font-weight:600}
.wcol .dn{font-size:16px;font-weight:700;width:30px;height:30px;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%}
.wcol.today .dn{background:var(--accent);color:#fff}
.wcol .sband{height:8px;border-radius:4px}
.wcol .wev{font-size:12px;font-weight:600;border-radius:6px;padding:3px 2px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1.5px solid;background:transparent}
.tl{position:relative;background:var(--card);border-radius:16px;margin-top:6px;overflow:hidden;padding-top:10px}
.tl .hr{height:48px;border-top:1px solid var(--sep);position:relative}
.tl .hr span{position:absolute;top:2px;left:8px;font-size:12px;color:var(--sub)}
.tl .region{position:absolute;left:56px;right:0;opacity:.5;pointer-events:none}
.tl .tlev{position:absolute;left:60px;right:8px;border-radius:10px;padding:6px 10px;color:#fff;font-size:13px;font-weight:600;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18);border:0;text-align:left;cursor:pointer}
.tl .tlev small{display:block;font-weight:500;opacity:.85}
.nowline{position:absolute;left:52px;right:0;height:2px;background:var(--accent);z-index:5;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-6px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.allday{display:flex;gap:6px;flex-wrap:wrap;padding:10px;border-bottom:1px solid var(--sep)}
.allday .chip{border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;border:1.5px solid;background:transparent;cursor:pointer}
.rot{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
.rot button{aspect-ratio:1;border-radius:12px;border:0;font-size:16px;font-weight:800;color:#fff;cursor:pointer;min-height:48px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.legend b{display:inline-flex;width:22px;height:22px;border-radius:7px;color:#fff;align-items:center;justify-content:center;font-size:12px;margin-right:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none}
.overlay.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-radius:24px 24px 0 0;max-width:480px;margin:0 auto;max-height:88vh;max-height:88dvh;overflow-y:auto;transform:translateY(105%);padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet{transition:transform .42s cubic-bezier(.34,1.4,.64,1)}
.sheet.open{transform:translateY(0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 10px}
.sheet h2{font-size:20px;margin:4px 0 12px}
.frm{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:14px}
.frow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--sep);min-height:48px}
.frow:first-child{border-top:0}
.frow label{width:82px;font-size:15px;flex:none}
.frow input,.frow textarea{flex:1;border:0;background:none;font:inherit;color:var(--text);font-size:15px;outline:none;min-height:32px;font-family:inherit}
textarea#fDetails{min-height:110px;resize:vertical;line-height:1.45}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}
.chip{border:2px solid var(--sep);background:none;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;min-height:44px}
.chip.on{color:#fff;border-color:transparent}
.bigbtn{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;padding:14px;min-height:56px;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.bigbtn.small{font-size:15px;min-height:48px;padding:10px}
.danger{background:var(--red)!important;color:#fff!important}
.ghost{background:var(--card);color:var(--sub)}
.qa-hero{background:var(--card);border-radius:16px;padding:16px;margin:8px 0;border-left:5px solid var(--steel)}
.qa-hero .d{font-size:13px;color:var(--steel);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.qa-hero .t{font-size:19px;font-weight:700;margin-top:4px}
.qa-hero .s{font-size:14px;color:var(--sub);margin-top:4px;line-height:1.45}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--eveOrange);margin:4px 0}
.filerow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;margin:8px 0}
.filerow .fi{width:40px;height:40px;border-radius:10px;background:var(--steel);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.filerow .fn{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .fd{font-size:12px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.greeting{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:8px 2px 2px;line-height:1.15}
.gcapt{font-size:13px;color:var(--sub);margin:2px 2px 4px}
.foresight{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 12px rgba(26,43,38,.06);font-size:14px;font-weight:500}
.foresight svg{width:20px;height:20px;color:var(--accent);flex:none}
.mstrip{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.mstrip::-webkit-scrollbar{display:none}
.msd{min-width:46px;border:0;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;color:var(--text);cursor:pointer;background:var(--card)}
.msd .msw{font-size:11px;color:var(--sub);font-weight:600}
.msd .msn{font-size:15px;font-weight:700;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.msd.td .msn{background:var(--accent);color:#fff}
.msd.sel:not(.td) .msn{box-shadow:0 0 0 2px var(--accent)}
.msd .msl{font-size:10px;font-weight:800;border-radius:5px;padding:0 5px;line-height:14px}
.msd .msdots{display:flex;gap:2px;min-height:5px}
.msd .msdots i{width:5px;height:5px;border-radius:50%;display:block}
.nowcue{display:flex;align-items:center;gap:8px;margin:6px 4px}
.nowcue i{flex:1;height:2px;background:var(--accent);border-radius:2px}
.nowcue span{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
.streakchip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--eveOrange);background:var(--card2);border-radius:999px;padding:1px 8px;vertical-align:2px;margin-left:6px}
.streakchip svg{width:12px;height:12px}
nav .fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:0;margin:-26px 4px 0;box-shadow:0 8px 18px rgba(244,99,58,.38);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
nav .fab svg{width:26px;height:26px}
nav .fab:active{transform:scale(.94)}
.detail-hero{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.detail-hero .dt{font-size:22px;font-weight:700;line-height:1.2}
.detail-hero .dm{font-size:14px;color:var(--sub);margin-top:6px}
.detail-hero pre{white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.55;margin:12px 0 0;color:var(--text)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="hdrTitle">Today</h1>
    <div class="hdr-actions">
      <button class="hbtn" id="btnToday" style="display:none">Today</button>
      <button class="hbtn icon" id="btnProgress" aria-label="Progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20v-7M12 20V6M19 20v-11"/></svg></button>
      <button class="hbtn icon" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08A1.7 1.7 0 0 0 10.12 3V3a2 2 0 1 1 4 0v.09c0 .68.4 1.3 1.03 1.56.6.26 1.32.13 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08c.26.63.88 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09c-.68 0-1.3.4-1.51 1.03z"/></svg></button>
    </div>
  </header>
  <main id="view"></main>
  <nav><div class="bar">
    <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>Today</button>
    <button data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Calendar</button>
    <button class="fab" id="btnFab" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="shifts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>Shifts</button>
    <button data-tab="qa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M8 7.5h8M8 11h5"/></svg>Q&amp;A</button>
  </div></nav>
</div>
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ================= data ================= */
const LS_E="daybook.events.v2", LS_S="daybook.settings.v1", LS_SEED="daybook.seeded.v2";

function genEvent(id){
  const m=id.match(/^([a-z]+)-(\d{4}-\d{2}-\d{2})$/);if(!m)return null;
  const kind=m[1],ds=m[2];
  if(ds<GEN_START||ds>GEN_END)return null;
  const base={id,date:ds,end:"",note:"",link:"",attach:"",log:"",status:"open",done:false};
  if(kind==="qa"){if(ds<"2026-11-26")return null;
    const n=Math.round((parseD(ds)-parseD("2026-11-26"))/864e5)+1;
    return Object.assign(base,{title:"Daily 20 Q&A steel file",time:shiftFor(ds).key==="D"?"10:00":"18:00",cat:"steel",
      details:"Day "+n+" of the steel Q&A rotation. 20 questions, about 15 minutes.\n1. Open the file (button below).\n2. Read each question, answer out loud before checking.\n3. Mark it done when finished."})}
  if(kind==="wo"){const n=Math.round((parseD(ds)-parseD("2026-11-26"))/864e5);if(n<0||n%2)return null;
    const s=Math.floor(n/2)%3;
    return Object.assign(base,{title:"Workout - Session "+PLAN_NAMES[s]+" (proposed)",time:WO_TIME[shiftFor(ds).key]||"10:00",cat:"workout",details:PLANS[s]})}
  if(kind==="wi"){if(parseD(ds).getDay()!==5||ds<"2026-11-27")return null;
    return Object.assign(base,{title:"Weekly weigh-in + hair photo",time:"08:00",cat:"workout",
      details:"Morning weigh-in: after the bathroom, before food, same scale.\n1. Log the number in the Log field below.\n2. Take the hair-shed photo (shower drain) after your shower.\n3. Send both to Farid for the Friday check-in."})}
  return null;
}
if(settings.genV!==GEN_V){
  const del=settings.deletedIds||[];
  const old={};events.forEach(e=>{old[e.id]=e});
  const out=[];
  const adopt=g=>{
    const o=old[g.id];delete old[g.id];
    if(o&&o.__edited){out.push(o);return}
    if(o){g.done=!!o.done;g.status=o.status||(o.done?"done":"open");g.log=o.log||"";if(o.link)g.link=o.link;if(o.attach)g.attach=o.attach}
    out.push(g);
  };
  let gds=GEN_START;
  while(gds<=GEN_END){
    for(const p of ["qa","wo","wi"]){
      const rid=p+"-"+gds;if(del.includes(rid))continue;
      const g=genEvent(rid);if(g)adopt(g);
    }
    const dd=parseD(gds);dd.setDate(dd.getDate()+1);
    gds=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
  }
  const fbLinks={};
  Object.keys(old).forEach(k=>{if(/^pubfb-/.test(k)&&old[k].link)fbLinks[old[k].date]=old[k].link});
  for(const s of SLOTS){
    const d=s[0],t=s[1],pl=s[2],st=s[3],story=s[4]||"";
    if(d<GEN_START||d>GEN_END)continue;
    const id="pub-"+d+"-"+pl+"-"+t;if(del.includes(id))continue;
    const g={id,date:d,time:t.slice(0,2)+":"+t.slice(2),end:"",cat:"content",note:"",
      link:(pl==="fb"&&fbLinks[d])?fbLinks[d]:"",attach:"",log:"",status:"open",done:false,
      title:(story?story+" - ":"")+PLAT_NAME[pl]+(st==="p"?" (proposed)":""),
      pubState:st==="p"?"proposed":"scheduled",
      details:(st==="p"?"Proposed slot":"Scheduled slot")+" in the Tiny Wins content plan on "+PLAT_NAME[pl]+".\nAfter posting, edit this event and paste the video link so one tap opens it."};
    adopt(g);
  }
  Object.keys(old).forEach(k=>{
    const e=old[k];
    if(del.includes(k))return;
    if(/^pub-\d{4}-\d{2}-\d{2}$/.test(k)&&!e.__edited)return; // superseded by slot events
    if(/^pubfb-/.test(k))return; // folded into slot events, link carried over
    out.push(e);
  });
  events=out;settings.genV=GEN_V;save();
}

function idbDel(store,key){return idb().then(d=>new Promise((res,rej)=>{const tx=d.transaction(store,"readwrite");tx.objectStore(store).delete(key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))}

/* ================= PROGRESS ================= */
function weekBounds(off=0){
  const t=new Date();const ws=wsNorm();
  let d=new Date(t);d.setDate(d.getDate()-(((wdIndex(t)-ws)+7)%7)-7*off);
  const s=dstr(d);d.setDate(d.getDate()+6);return [s,dstr(d)];
}
function weekStats(off=0){
  const[s,e2]=weekBounds(off);const ds=todayStr();
  const wk=events.filter(e=>e.date>=s&&e.date<=(off===0&&e2>ds?ds:e2));
  const done=wk.filter(e=>e.status==="done").length,skip=wk.filter(e=>e.status==="skipped").length;
  const open=wk.length-done-skip;
  const pct=(done+skip)?Math.round(done/(done+skip)*100):(done?100:0);
  return {done,skip,open,pct,total:wk.length,s,e:e2};
}
function streakOf(cat){
  let n=0,d=new Date();
  const todayE=events.find(e=>e.cat===cat&&e.date===dstr(d));
  if(!todayE||todayE.status!=="done")d.setDate(d.getDate()-1);
  for(;;){const e=events.find(x=>x.cat===cat&&x.date===dstr(d));
    if(e&&e.status==="done"){n++;d.setDate(d.getDate()-1)}
    else if(e&&e.status==="skipped")break;
    else break}
  return n;
}
function rProgress(){

    <div style="display:flex;gap:8px">
    <div class="card" style="flex:1;text-align:center"><div style="font-size:22px;font-weight:800;color:var(--steel);display:flex;align-items:center;justify-content:center;gap:5px"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>${qaS}</div><div style="font-size:12px;color:var(--sub)">Q&amp;A streak</div></div>
    <div class="card" style="flex:1;text-align:center"><div style="font-size:22px;font-weight:800;color:var(--workout);display:flex;align-items:center;justify-content:center;gap:5px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l1.767-1.768a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1 2.828-2.829l2.829 2.828a2 2 0 1 1-2.828 2.829z"/><path d="M6.343 3.515a2 2 0 1 1 2.829-2.828l6.364 6.364a2 2 0 1 1-2.829 2.828l1.768 1.768a2 2 0 1 1-2.829 2.829z"/></svg>${woS}</div><div style="font-size:12px;color:var(--sub)">Workout streak</div></div></div>
    <div class="card">${bar(w,"This week")}${bar(w1,"Last week")}${bar(w2,"2 weeks ago")}${bar(w3,"3 weeks ago")}</div>`;
  const skipped=events.filter(e=>e.status==="skipped").sort((a,b)=>a.date>b.date?-1:1).slice(0,5);
  if(skipped.length){h+=`<div class="sect">Recently skipped</div>`;
    skipped.forEach(e=>{h+=`<div class="ev cat-${e.cat}" data-open="${e.id}"><div class="tm">${WD[wdIndex(parseD(e.date))]} ${parseD(e.date).getDate()}</div><div style="flex:1"><div class="tt" style="font-size:15px">${esc(e.title)}${e.pubState==="proposed"?' <span class="ptag">proposed</span>':""}</div><div class="ct">${CATS[e.cat].n} — tap to reschedule or do it</div></div></div>`})}
  h+=`<div class="sect">Coaching</div>
    <button class="bigbtn" id="pShare">Share progress with Farid</button>
    <div style="font-size:13px;color:var(--sub);text-align:center;padding:0 12px 8px">Sends a short summary you approve first — nothing leaves the phone on its own.</div>`;
  view.innerHTML=h;
  document.getElementById("pShare").onclick=shareProgress;
}
function shareProgress(){
  const w=weekStats(0),w1=weekStats(1);
  const lines=[`Daybook progress — week of ${niceDate(w.s).split(", ")[1]}:`,`Done ${w.done} · skipped ${w.skip} · open ${w.open} → ${w.done+w.skip?w.pct+"%":"—"}`,`Last week: done ${w1.done} · skipped ${w1.skip} → ${w1.done+w1.skip?w1.pct+"%":"—"}`,`Streaks: Q&A ${streakOf("steel")} days · workouts ${streakOf("workout")} days`];
  const skipped=events.filter(e=>e.status==="skipped"&&e.date>=w.s).map(e=>"- "+e.title+" ("+e.date+")");
  if(skipped.length)lines.push("Skipped this week:",...skipped);
  const txt=lines.join("\n");
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("Summary copied — paste it to Farid"));
  else toast("Sharing is not available here");
}

function wsNorm(){return (settings.weekStart+6)%7} // getDay(1=Mon..0=Sun) -> WD index(0=Mon)
function monthHTML(){
  const y=cursor.getFullYear(),m=cursor.getMonth(),ws=wsNorm();
  const startOff=(wdIndex(new Date(y,m,1))-ws+7)%7;
  let h=`<div class="sect" data-mpick="1" style="text-align:center;font-size:15px;text-transform:none;letter-spacing:0;cursor:pointer">${MON[m]} ${y} <span style="color:var(--accent);font-size:12px">&#9662;</span></div><div class="mgrid">`;
  for(let i=0;i<7;i++)h+=`<div class="wd">${WD[(ws+i)%7]}</div>`;
  let d=new Date(y,m,1-startOff);
  for(let i=0;i<42;i++){
    const ds=dstr(d),sh=shiftFor(ds),ev=evsOn(ds);
    let dots="";ev.slice(0,3).forEach(e=>{dots+=`<i style="background:${CATS[e.cat].c}"></i>`});
    if(ev.length>3)dots=`<span class="more">+${ev.length-3}</span>`+dots;
    h+=`<button class="mcell tint-${sh.key}${d.getMonth()!==m?" dim":""}${ds===todayStr()?" today":""}${ds===selDay?" sel":""}" data-day="${ds}">
      <span class="dn">${d.getDate()}</span><span class="sl badge-${sh.key}">${sh.key}</span><span class="dots">${dots}</span></button>`;
    d.setDate(d.getDate()+1);
  }
  return h+"</div>";
}
function weekHTML(){
  let base=parseD(selDay);const off=(wdIndex(base)-wsNorm()+7)%7;base.setDate(base.getDate()-off);
  let h=`<div class="sect" style="text-align:center;text-transform:none;letter-spacing:0">Week of ${MON[base.getMonth()].slice(0,3)} ${base.getDate()}</div><div class="wgrid">`;
  for(let i=0;i<7;i++){
    const d=new Date(base);d.setDate(d.getDate()+i);const ds=dstr(d),sh=shiftFor(ds),ev=evsOn(ds);
    let blocks="";ev.slice(0,5).forEach(e=>{blocks+=`<span class="wev" style="color:${CATS[e.cat].c};border-color:${CATS[e.cat].c}">${e.time?e.time+" ":""}${esc(e.title.split("(")[0].slice(0,14))}</span>`});
    h+=`<button class="wcol${ds===todayStr()?" today":""}" data-day="${ds}"><span class="wd">${WD[wdIndex(d)]}</span><span class="dn">${d.getDate()}</span><span class="sband badge-${sh.key}"></span>${blocks}</button>`;
  }

function dayHTML(){
  const ds=selDay,sh=shiftFor(ds),list=evsOn(ds),H=48;
  const timed=list.filter(e=>e.time),unt=list.filter(e=>!e.time);
  let h=`<div class="sect" style="text-align:center;text-transform:none;letter-spacing:0">${niceDate(ds)} · ${sh.name}${sh.key!=="O"?" "+fmtTime(sh.start)+"–"+fmtTime(sh.end):""}</div>`;
  if(unt.length){h+=`<div class="allday">`;unt.forEach(e=>{h+=`<button class="chip" style="color:${CATS[e.cat].c};border-color:${CATS[e.cat].c}" data-open="${e.id}">${esc(e.title)}</button>`});h+=`</div>`}
  h+=`<div class="tl">`;
  for(let i=0;i<24;i++)h+=`<div class="hr"><span>${pad(i)}:00</span></div>`;
  if(sh.key!=="O"&&sh.start){
    const s=parseInt(sh.start)*60,e2=parseInt(sh.end)*60+(sh.end<sh.start?1440:0);
    h+=`<div class="region tint-${sh.key}" style="top:${10+s/60*H}px;height:${Math.min((e2-s)/60*H,24*H-s/60*H)}px"></div>`;
    if(sh.end<sh.start){const[eh,em]=sh.end.split(":").map(Number);h+=`<div class="region tint-${sh.key}" style="top:10px;height:${(eh*60+em)/60*H}px"></div>`}
  }
  timed.forEach(e=>{
    const[hh,mm]=e.time.split(":").map(Number);const top=(hh*60+mm)/60*H;
    let dur=60;if(e.end){const[eh,em]=e.end.split(":").map(Number);dur=Math.max(30,(eh*60+em)-(hh*60+mm))}
    h+=`<button class="tlev" style="top:${top+12}px;height:${Math.min(dur,1440)/60*H-6}px;background:${CATS[e.cat].c}" data-open="${e.id}">${esc(e.title)}<small>${fmtTime(e.time)}${e.end?" – "+fmtTime(e.end):""} · ${CATS[e.cat].n}</small></button>`;
  });
  if(ds===todayStr()){const n=new Date();h+=`<div class="nowline" style="top:${10+(n.getHours()*60+n.getMinutes())/60*H}px"></div>`}
  h+=`</div>`;
  if(!list.length)h+=`<div class="empty">Nothing on this day yet.<br>Tap + to add something.</div>`;
  return h;
}

  <div style="display:flex;gap:10px">
  <button class="bigbtn" id="dDone" style="flex:1;${e.status==="done"?"background:var(--trainGreen)":""}">${e.status==="done"?"Done ✓":"Done"}</button>
  <button class="bigbtn" id="dSkip" style="flex:1;${e.status==="skipped"?"background:var(--sep);color:var(--text)":"background:var(--card2);color:var(--sub)"}">${e.status==="skipped"?"Skipped ✓":"Skip"}</button>
  <button class="bigbtn" id="dEdit" style="flex:1;background:var(--card2);color:var(--accent)">Edit</button></div>
  <button class="bigbtn ghost" id="dDel" style="color:var(--red)">Delete event</button>`;
  openSheet(h);
  const dl=sheet.querySelector("#dLog");dl.onchange=()=>{e.log=dl.value.trim();save();toast("Logged")};
  sheet.querySelector("#dDone").onclick=()=>{e.status=e.status==="done"?"open":"done";e.done=e.status==="done";save();closeSheet();render()};
  sheet.querySelector("#dSkip").onclick=()=>{e.status=e.status==="skipped"?"open":"skipped";e.done=e.status==="done";save();closeSheet();render()};
  sheet.querySelector("#dEdit").onclick=()=>eventForm(e);
  const df=sheet.querySelector("#dFile");if(df)df.onclick=()=>openEventFile(e);
  const del=sheet.querySelector("#dDel");let armed=false;
  del.onclick=()=>{if(!armed){armed=true;del.textContent="Tap again to delete";del.classList.add("danger");return}
    events=events.filter(x=>x.id!==e.id);
    if(RULE_IDS.test(e.id)){settings.deletedIds=settings.deletedIds||[];if(!settings.deletedIds.includes(e.id))settings.deletedIds.push(e.id)}
    save();closeSheet();render();toast("Deleted")};
}
/* ================= event form ================= */
function eventForm(e){
  const isNew=!e.id;
  openSheet(`<h2>${isNew?"New event":"Edit event"}</h2>
  <div class="frm">
    <div class="frow"><label>Title</label><input id="fTitle" value="${esc(e.title)}" placeholder="What's happening"></div>
    <div class="frow"><label>Date</label><input type="date" id="fDate" value="${e.date}"></div>
    <div class="frow"><label>Time</label><input type="time" id="fTime" value="${e.time||""}"></div>
    <div class="frow"><label>End</label><input type="time" id="fEnd" value="${e.end||""}"></div>
    <div class="frow"><label>Link</label><input id="fLink" type="url" value="${esc(e.link||"")}" placeholder="https://…"></div>
    <div class="frow"><label>Note</label><input id="fNote" value="${esc(e.note||"")}" placeholder="Optional"></div>
  </div>
  <div class="frm"><div class="frow" style="align-items:flex-start"><label>Details</label><textarea id="fDetails" placeholder="Plan, exercises, what to do…">${esc(e.details||"")}</textarea></div></div>
  <div class="sect">Category</div>
  <div class="chips" id="fCats">${Object.keys(CATS).map(k=>`<button class="chip${e.cat===k?" on":""}" data-cat="${k}" style="${e.cat===k?`background:${CATS[k].c}`:""}">${CATS[k].n}</button>`).join("")}</div>
  <div style="height:14px"></div>
  <button class="bigbtn" id="fSave">${isNew?"Add event":"Save"}</button>`);
  let cat=e.cat;
  sheet.querySelectorAll("#fCats .chip").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;sheet.querySelectorAll("#fCats .chip").forEach(x=>{x.classList.toggle("on",x===b);x.style.background=x===b?CATS[cat].c:""})});
  sheet.querySelector("#fSave").onclick=()=>{
    const title=sheet.querySelector("#fTitle").value.trim();
    if(!title){toast("Give it a title first");return}
    const rec={id:e.id||uid(),title,date:sheet.querySelector("#fDate").value||todayStr(),
      time:sheet.querySelector("#fTime").value,end:sheet.querySelector("#fEnd").value,cat,
      note:sheet.querySelector("#fNote").value.trim(),details:sheet.querySelector("#fDetails").value.trim(),
      link:sheet.querySelector("#fLink").value.trim(),attach:e.attach||"",done:e.done||false,log:e.log||"",status:e.status||(e.done?"done":"open")};
    if(RULE_IDS.test(rec.id))rec.__edited=true;
    if(e.id)events=events.map(x=>x.id===e.id?rec:x);else events.push(rec);
    save();render();eventFormDone(rec);
  };
}
function eventFormDone(rec){openDetail(rec.id);render();toast("Saved")}
/* ================= settings ================= */
function settingsSheet(){
  openSheet(`<h2>Settings</h2>
  <div class="frm">
    <div class="frow"><label>Theme</label><div class="chips" id="sTheme">${["auto","light","dark"].map(t=>`<button class="chip${settings.theme===t?" on":""}" data-th="${t}" style="${settings.theme===t?"background:var(--accent)":""}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div></div>
    <div class="frow"><label>Week starts</label><div class="chips" id="sWeek">${[[1,"Mon"],[6,"Sat"],[0,"Sun"]].map(([v,n])=>`<button class="chip${settings.weekStart===v?" on":""}" data-ws="${v}" style="${settings.weekStart===v?"background:var(--accent)":""}">${n}</button>`).join("")}</div></div>
    <div class="frow"><label>Reminders</label><button class="chip" id="sNotif" style="${settings.remind?"background:var(--accent);color:#fff;border-color:transparent":""}">${settings.remind?"On":"Turn on"}</button></div>
  </div>
  <div class="sect">Backup</div>
  <button class="bigbtn" id="sExport" style="background:var(--card2);color:var(--accent)">Export calendar (.ics)</button>
  <button class="bigbtn" id="sImport" style="background:var(--card2);color:var(--accent)">Import .ics file</button>
  <input type="file" id="icsFile" accept=".ics,text/calendar" style="display:none">
  <div class="sect">Danger zone</div>
  <button class="bigbtn ghost" id="sErase">Erase all data</button>`);
  sheet.querySelectorAll("#sTheme .chip").forEach(b=>b.onclick=()=>{settings.theme=b.dataset.th;save();closeSheet();render()});
  sheet.querySelectorAll("#sWeek .chip").forEach(b=>b.onclick=()=>{settings.weekStart=+b.dataset.ws;save();closeSheet();render()});
  sheet.querySelector("#sNotif").onclick=async()=>{
    if(!("Notification" in window)){toast("This browser has no notifications");return}
    const p=await Notification.requestPermission();
    if(p==="granted"){settings.remind=true;save();closeSheet();render();toast("Reminders on");
      navigator.serviceWorker?.ready.then(r=>{r.periodicSync?.register("daybook-remind",{minInterval:60*60*1000}).catch(()=>{})}).catch(()=>{})}
    else toast("Notifications were blocked");
  };
  sheet.querySelector("#sExport").onclick=exportICS;
  sheet.querySelector("#sImport").onclick=()=>sheet.querySelector("#icsFile").click();
  sheet.querySelector("#icsFile").onchange=importICS;
  const er=sheet.querySelector("#sErase");let armed=false;
  er.onclick=()=>{if(!armed){armed=true;er.textContent="Tap again to erase everything";er.classList.add("danger");return}
    events=[];localStorage.removeItem(LS_SEED);save();location.reload()};
}
/* ================= reminders (best effort, app open) ================= */
let timers=[];
function scheduleReminders(){
  timers.forEach(clearTimeout);timers=[];
  if(!settings.remind||!("Notification" in window)||Notification.permission!=="granted")return;
  const ds=todayStr(),now=Date.now();
  evsOn(ds).forEach(e=>{
    if(!e.time||e.done)return;
    const[h,m]=e.time.split(":").map(Number);
    const at=new Date();at.setHours(h,m,0,0);
    const dt=at-now;if(dt<1000||dt>86400000)return;
    timers.push(setTimeout(()=>notify(e),dt));
  });
}
function notify(e){
  const body=(e.details?e.details.split("\n")[0]:(e.note||CATS[e.cat].n));
  const opts={body,tag:e.id,data:{url:deepLink(e.id)},icon:"icon-192.png",badge:"icon-192.png"};
  if(navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(e.title,opts)).catch(()=>new Notification(e.title,opts));
  else new Notification(e.title,opts);
}
/* ================= ICS ================= */
function exportICS(){
  let s="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Daybook//EN\r\n";
  events.forEach(e=>{
    const d=e.date.replace(/-/g,""),t=(e.time||"09:00").replace(":","")+"00";
    s+="BEGIN:VEVENT\r\nUID:"+e.id+"@daybook\r\nDTSTART:"+d+"T"+t+"\r\n";
    if(e.end)s+="DTEND:"+d+"T"+e.end.replace(":","")+"00\r\n";
    s+="SUMMARY:"+escICS(e.title)+"\r\n";
    s+="DESCRIPTION:"+escICS(deepLink(e.id)+(e.details?"\\n\\n"+e.details:""))+"\r\n";
    if(e.link)s+="URL:"+e.link+"\r\n";
    s+="END:VEVENT\r\n";
  });
  s+="END:VCALENDAR\r\n";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/calendar"}));a.download="daybook.ics";a.click();
  toast("Exported "+events.length+" events");
}
const escICS=s=>s.replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
function importICS(ev){
  const f=ev.target.files[0];if(!f)return;
  f.text().then(txt=>{
    const lines=txt.replace(/\r\n[ \t]/g,"").replace(/\n[ \t]/g,"").split(/\r?\n/);
    let cur=null,n=0;
    lines.forEach(l=>{
      if(l==="BEGIN:VEVENT")cur={};
      else if(l==="END:VEVENT"&&cur){
        if(cur.title&&cur.date){events.push({id:uid(),title:cur.title,date:cur.date,time:cur.time||"",end:cur.end||"",cat:"personal",note:"",details:cur.desc||"",link:cur.url||"",attach:"",done:false,log:""});n++}
        cur=null;
      }else if(cur){
        let m=l.match(/^SUMMARY[^:]*:(.*)$/);if(m)cur.title=unICS(m[1]);
        m=l.match(/^DESCRIPTION[^:]*:(.*)$/);if(m)cur.desc=unICS(m[1]);
        m=l.match(/^URL[^:]*:(.*)$/);if(m)cur.url=m[1].trim();
        m=l.match(/^DTSTART[^:]*:(\d{8})T?(\d{4})?/);if(m){cur.date=m[1].slice(0,4)+"-"+m[1].slice(4,6)+"-"+m[1].slice(6,8);if(m[2])cur.time=m[2].slice(0,2)+":"+m[2].slice(2)}
        m=l.match(/^DTEND[^:]*:\d{8}T(\d{4})/);if(m)cur.end=m[1].slice(0,2)+":"+m[1].slice(2);
      }
    });
    save();closeSheet();render();toast(n?("Imported "+n+" events"):"No events found in that file");
  });
}
const unICS=s=>s.replace(/\\n/g,"\n").replace(/\\,/g,",").replace(/\\;/g,";").replace(/\\\\/g,"\\");
/* ================= interactions ================= */
document.querySelectorAll("nav button[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab==="today"){selDay=todayStr();cursor=parseD(selDay)}render()});
document.getElementById("btnFab").onclick=()=>eventForm({id:"",title:"",date:selDay,time:"",end:"",cat:"task",note:"",details:"",link:"",attach:""});
document.getElementById("btnProgress").onclick=()=>{tab="progress";render()};
document.getElementById("btnSettings").onclick=settingsSheet;
document.getElementById("btnToday").onclick=()=>{cursor=new Date();selDay=todayStr();render()};
view.addEventListener("click",e=>{
  const chk=e.target.closest("[data-chk]");
  if(chk){e.stopPropagation();const ev=evById(chk.dataset.chk);
    if(ev.status!=="done"){
      const r=chk.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      const card=chk.closest(".ev");if(card)card.classList.add("flash");
      const wasFirst=evsOn(todayStr()).every(x=>x.status!=="done");
      ev.status="done";ev.done=true;save();
      setTimeout(()=>{
        render();
        const qs=streakOf("steel"),ws=streakOf("workout");
        if(ev.cat==="content")celebrate("Published! The world sees your work.",cx,cy);
        else if(ev.cat==="steel"&&qs===1)celebrate("First brick. Streak started.",cx,cy);
        else if([3,7,14,30].includes(qs)&&ev.cat==="steel")celebrate(qs+"-day Q&A streak! Keep the fire.",cx,cy);
        else if([3,7,14,30].includes(ws)&&ev.cat==="workout")celebrate(ws+"-day workout streak! Getting stronger.",cx,cy);
        else if(wasFirst)celebrate("First win of the day. That's the hard part.",cx,cy);
        else celebrate(ENCOURAGE[encIdx=(getEncIdx()+1)%ENCOURAGE.length],cx,cy);
      },320);
      return;
    }
    ev.status="open";ev.done=false;save();render();return}
  const of=e.target.closest("[data-openfile]");
  if(of){openEventFile(evById(of.dataset.openfile));return}
  const fo=e.target.closest("[data-fopen]");
  if(fo){openFile(fo.dataset.fopen);return}
  const fd=e.target.closest("[data-fdel]");
  if(fd){idbDel("files",fd.dataset.fdel).then(renderFiles);return}
  const op=e.target.closest("[data-open]");
  if(op){openDetail(op.dataset.open);return}
  const day=e.target.closest("[data-day]");
  if(day){selDay=day.dataset.day;cursor=parseD(selDay);calMode="day";render();return}
  const mpk=e.target.closest("[data-mpick]");
  if(mpk){monthPicker();return}
  const seg=e.target.closest("[data-m]");
  if(seg){calMode=seg.dataset.m;render();return}
  const rot=e.target.closest("[data-rot]");
  if(rot){const i=+rot.dataset.rot;const seq=["O","D","E","N"];const cur=settings.rot.pattern[i];settings.rot.pattern[i]=seq[(seq.indexOf(cur)+1)%seq.length];save();render();return}
  if(e.target.id==="saveRot"){
    settings.rot.anchor=document.getElementById("anchorIn").value||settings.rot.anchor;
    for(const k of["D","E","N"])settings.rot.times[k]=[document.getElementById("t"+k+"0").value||settings.rot.times[k][0],document.getElementById("t"+k+"1").value||settings.rot.times[k][1]];
    save();render();toast("Rotation saved");return}
  const tg=e.target.closest("[data-tog]");
  if(tg){const c=tg.querySelector("[data-chk]");if(c)c.click();return}
  const sd=e.target.closest("[data-sday]");
  if(sd){selDay=sd.dataset.sday;cursor=parseD(selDay);render();return}
  const card=e.target.closest(".ev[data-id]");
  if(card)openDetail(card.dataset.id);
});
let tx=0,ty=0,pull=0;
view.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;pull=view.scrollTop<=0?e.touches[0].clientY:0},{passive:true});
view.addEventListener("touchmove",e=>{
  if(pull&&tab==="today"&&e.touches[0].clientY-pull>80){
    pull=0;encIdx=(getEncIdx()+1)%ENCOURAGE.length;
    const el=document.getElementById("encLine");if(el)el.textContent=ENCOURAGE[getEncIdx()];
  }
},{passive:true});
view.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
    const dir=dx<0?1:-1;
    if(tab==="calendar"){
      if(calMode==="month")cursor.setMonth(cursor.getMonth()+dir);
      else{const d=parseD(selDay);d.setDate(d.getDate()+(calMode==="week"?7:1)*dir);selDay=dstr(d);cursor=d}
      render();
    }
  }
},{passive:true});
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}
setInterval(()=>{applyTheme();if(tab==="calendar"&&calMode==="day")render()},60000);
/* ================= boot + deep link ================= */
render();
(function(){
  const m=location.hash.match(/^#\/event\/(.+)$/);
  if(m){const e=evById(decodeURIComponent(m[1]));if(e){selDay=e.date;cursor=parseD(e.date);openDetail(e.id)}}
})();
window.addEventListener("hashchange",()=>{
  const m=location.hash.match(/^#\/event\/(.+)$/);
  if(m){const e=evById(decodeURIComponent(m[1]));if(e)openDetail(e.id)}
});
/* remote updates feed: fills EMPTY link fields from a repo-hosted updates.json (Drive study links land here) */
fetch("updates.json?cb="+Date.now()).then(r=>r.ok?r.json():null).then(u=>{
  if(!u||!u.links)return;let changed=false;
  events.forEach(e=>{if(u.links[e.id]&&!e.link){e.link=u.links[e.id];changed=true}});
  if(changed){save();render()}
}).catch(()=>{});
/* service worker: updates install themselves; reload only at a safe moment (never mid-edit) */
let pendingUpdate=false,updateReloaded=false;
function maybeReloadUpdate(){
  if(!pendingUpdate||updateReloaded)return;
  if(sheet.classList.contains("open"))return; // never while a sheet/editor is open
  if(document.visibilityState!=="visible")return; // wait for next open
  updateReloaded=true;
  try{sessionStorage.setItem("daybook.justUpdated","1")}catch(e){}
  location.reload();
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(reg=>{reg.update().catch(()=>{})});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{pendingUpdate=true;maybeReloadUpdate()});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")maybeReloadUpdate()});
}
try{if(sessionStorage.getItem("daybook.justUpdated")){sessionStorage.removeItem("daybook.justUpdated");setTimeout(()=>toast("Updated to the latest version"),600)}}catch(e){}
</script>
